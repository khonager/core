name: Flutter Quality

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter SDK version used by the application
        required: true
        type: string
      java-version:
        description: Java version used by Android tooling
        default: "17"
        required: false
        type: string
      working-directory:
        description: Flutter package directory
        default: "."
        required: false
        type: string
      format-paths:
        description: Space-separated paths checked by dart format
        default: "lib test"
        required: false
        type: string

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed ${{ inputs.format-paths }}

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

