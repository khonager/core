name: Core app
on:
  push:
    branches: [main, unstable]
    tags: ['v*-dev.*']
  pull_request:
    paths: ['apps/core/**', 'catalog/**', 'scripts/**', '.github/workflows/core-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DEVELOPMENT: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    outputs:
      development-version: ${{ steps.development.outputs.version }}
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: python3 ../../scripts/sync_catalog.py --check
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Prepare development version and signing inputs
        id: development
        if: env.PUBLISH_DEVELOPMENT == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CORE_DEV_KEYSTORE_BASE64 }}
          CORE_RELEASE_STORE_PASSWORD: ${{ secrets.CORE_DEV_STORE_PASSWORD }}
          CORE_RELEASE_KEY_ALIAS: ${{ secrets.CORE_DEV_KEY_ALIAS }}
          CORE_RELEASE_KEY_PASSWORD: ${{ secrets.CORE_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*$/\1/p' pubspec.yaml)
          [[ -n "$version" ]] || { echo 'pubspec.yaml must contain VERSION+BUILD.' >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            suffix="${GITHUB_REF_NAME#v$version-dev.}"
            [[ "$GITHUB_REF_NAME" == "v$version-dev."* && "$suffix" =~ ^[0-9]+$ ]] || { echo 'Tag must match the pubspec version and use vVERSION-dev.RUN.' >&2; exit 1; }
            build_name="${GITHUB_REF_NAME#v}"
          else
            build_name="$version-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$build_name" >> "$GITHUB_OUTPUT"
          echo "CORE_BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          [[ -n "$KEYSTORE_BASE64" && -n "$CORE_RELEASE_STORE_PASSWORD" && -n "$CORE_RELEASE_KEY_ALIAS" && -n "$CORE_RELEASE_KEY_PASSWORD" ]] || { echo 'Core development signing secrets are required.' >&2; exit 1; }
          keystore="$RUNNER_TEMP/core-development.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [[ -s "$keystore" ]] || { echo 'Core development keystore is empty.' >&2; exit 1; }
          {
            echo "CORE_RELEASE_KEYSTORE=$keystore"
            echo "CORE_RELEASE_STORE_PASSWORD=$CORE_RELEASE_STORE_PASSWORD"
            echo "CORE_RELEASE_KEY_ALIAS=$CORE_RELEASE_KEY_ALIAS"
            echo "CORE_RELEASE_KEY_PASSWORD=$CORE_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          CORE_GITHUB_CLIENT_ID: ${{ vars.CORE_GITHUB_CLIENT_ID }}
        run: |
          args=()
          if [[ "$PUBLISH_DEVELOPMENT" == true ]]; then
            args+=(--build-name "$CORE_BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER")
          fi
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --dart-define="GITHUB_CLIENT_ID=$CORE_GITHUB_CLIENT_ID" "${args[@]}"
      - run: flutter build appbundle --dart-define="GITHUB_CLIENT_ID=$CORE_GITHUB_CLIENT_ID"
        env:
          CORE_GITHUB_CLIENT_ID: ${{ vars.CORE_GITHUB_CLIENT_ID }}
      - run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-development
          path: apps/core/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-android-development
          path: dist
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPMENT_VERSION: ${{ needs.android.outputs.development-version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Keep one rolling prerelease; stable and manually tagged releases stay intact.
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.tag_name == "dev") | .id')
            if [[ -n "$release_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
            tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/dev" \
              --jq '.[] | select(.ref == "refs/tags/dev") | .ref')
            if [[ -n "$tag_ref" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev"
            fi
            gh release create dev dist/*.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Core $DEVELOPMENT_VERSION" \
              --notes "Latest development build from main at $GITHUB_SHA. Signed with the Core development key." \
              --prerelease --latest=false
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Core $GITHUB_REF_NAME" \
            --notes "Development build from $GITHUB_SHA. Signed with the Core development key." \
            --prerelease --verify-tag
