name: Core app
on:
  push:
    branches: [main, unstable]
    paths: ['apps/core/**', 'catalog/**', 'scripts/**', '.github/workflows/core-app.yml']
  pull_request:
    paths: ['apps/core/**', 'catalog/**', 'scripts/**', '.github/workflows/core-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: python3 ../../scripts/sync_catalog.py --check
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - run: flutter build appbundle
      - run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-development
          path: apps/core/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
          if-no-files-found: error
