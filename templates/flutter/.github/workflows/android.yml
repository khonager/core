name: Android

on:
  push:
    branches: [main, unstable]
    tags: ["v*"]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "REPLACE_ME"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number="${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: APP_NAME-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

# Add an application-specific release job only after configuring a dedicated
# signing key. See docs/repositories-and-releases.md and Trace's workflow for a
# complete signed example.

